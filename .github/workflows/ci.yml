name: CommitPass CI

"on":
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/refundable-rsvp/package-lock.json
      - name: Build generated contract client
        working-directory: packages/refundable-rsvp
        run: npm ci --ignore-scripts && npm run build
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build

  contract:
    name: Soroban checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Format
        working-directory: contracts
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: contracts
        run: cargo test --workspace
      - name: Build contract Wasm
        working-directory: contracts
        run: cargo build --target wasm32v1-none --release --package refundable-rsvp
