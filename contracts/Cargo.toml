[workspace]
resolver = "2"
members = ["refundable-rsvp"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "27.0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
